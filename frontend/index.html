<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoSpark — Find your co-founder</title>
    <script>
      // Runs before any paint so the saved theme is applied without a flash of the
      // wrong one. Falls back to the operating system preference on a first visit.
      (function () {
        try {
          var saved = localStorage.getItem('cospark.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
