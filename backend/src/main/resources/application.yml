spring:
  application:
    name: cospark-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cospark}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:cospark}
    password: ${DB_PASSWORD:cospark}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: CoSparkHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:cospark}
    password: ${RABBITMQ_PASSWORD:cospark}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: 8080
  error:
    include-message: always

cospark:
  jwt:
    secret: ${JWT_SECRET:cospark-jwt-secret-change-in-production-min-256-bits-long-key!!}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  freemium:
    daily-request-limit: 5
  rate-limit:
    requests-per-minute: 100
    auth-requests-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false

logging:
  level:
    com.cospark: INFO
    org.springframework.security: WARN
